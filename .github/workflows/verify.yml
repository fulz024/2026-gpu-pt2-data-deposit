name: Verify paper data and figures
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python verify.py
      - run: python -m pip install -r requirements.txt
      - run: python reproduce.py --formats png
      - run: python tools/make_release.py
